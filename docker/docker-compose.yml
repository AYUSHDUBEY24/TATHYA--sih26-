# docker-compose.yml — SIH26190 Phase 10B (production-like local setup)
#
# Usage (from the repository root):
#   docker compose -f docker/docker-compose.yml --env-file .env up -d
#
# Or from inside the docker/ directory (reads docker/.env if present):
#   cd docker && docker compose up -d
#
# Infrastructure services required by the prototype:
#   - PostgreSQL 16 with the pgvector extension (metadata + RAG vectors)
#   - MinIO object storage (actual document files live here)
#   - Hardhat local Ethereum node (document hash anchoring ONLY)
#
# The FastAPI backend and Next.js frontend run on the host (see README).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sih26190-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sih}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sih_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sih26190}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sih} -d ${POSTGRES_DB:-sih26190}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sih26190-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sih_local_dev}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  hardhat:
    build:
      context: ../blockchain
      dockerfile: Dockerfile
    image: sih26190-hardhat
    container_name: sih26190-hardhat
    restart: unless-stopped
    # Local Ethereum node ONLY for hash anchoring — no mainnet, no tokens.
    command: npx hardhat node --hostname 0.0.0.0 --port 8545
    ports:
      - "8545:8545"

volumes:
  pgdata:
  miniodata:

